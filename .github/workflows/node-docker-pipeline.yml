name: Reusable Build and Push to ECR

# El evento 'workflow_call' permite que otros repositorios llamen a este pipeline
on:
  workflow_call:
    inputs:
      aws-region:
        description: 'Región de AWS'
        required: true
        type: string
      ecr-repository:
        description: 'Nombre del repositorio ECR'
        required: true
        type: string
      image-tag:
        description: 'Etiqueta de la imagen de Docker'
        required: false
        type: string
        default: 'latest'
      # VARIABLES PARA ECS
      ecs-cluster:
        required: true
        type: string
      ecs-service:
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clonar código del repositorio que llama
        uses: actions/checkout@v4

      - name: 2. Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}

      - name: 3. Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Compilar, etiquetar y subir imagen a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          # Construye la imagen usando el Dockerfile de la aplicación
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          # Sube la imagen a AWS ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
      # ACTUALIZACIÓN DEL SERVICIO ECS
      - name: 5. Forzar despliegue en AWS ECS (Descargar latest)
        run: |
          aws ecs update-service \
            --cluster ${{ inputs.ecs-cluster }} \
            --service ${{ inputs.ecs-service }} \
            --force-new-deployment \
            --region ${{ inputs.aws-region }}